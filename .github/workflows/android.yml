name: Build Vault APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create project and write app code
        run: |
          flutter create vault_app --platforms=android --org com.vault
          cd vault_app
          rm -rf test

          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q allowBackup "$MANIFEST" || sed -i 's/<application/<application android:allowBackup="false"/' "$MANIFEST"

          MAIN=$(find android/app/src/main -name 'MainActivity.kt' | head -n1)
          PKG=$(grep -m1 '^package' "$MAIN")
          cat > "$MAIN" <<EOF
          $PKG

          import android.os.Bundle
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  )
              }
          }
          EOF

          cat > pubspec.yaml <<'EOF'
          name: vault_app
          description: Secure vault for images and videos.
          publish_to: 'none'
          version: 2.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            file_picker: ^8.1.6
            cryptography: ^2.7.0
            shared_preferences: ^2.3.2
            path_provider: ^2.1.4
            share_plus: ^10.1.2
            video_player: ^2.9.1

          flutter:
            uses-material-design: true
          EOF

          cat > lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'dart:io';
          import 'dart:isolate';
          import 'dart:math';
          import 'dart:typed_data';

          import 'package:cryptography/cryptography.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/foundation.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:video_player/video_player.dart';

          // ---------------------------------------------------------------
          // CRYPTO (AES-256-GCM, chunked, key = PBKDF2(code))
          // ---------------------------------------------------------------
          const kMagic = <int>[0x56, 0x4C, 0x54, 0x32]; // VLT2
          const kChunk = 1024 * 1024;

          Future<SecretKey> _deriveKey(String code, List<int> salt) {
            return Pbkdf2(
              macAlgorithm: Hmac.sha256(),
              iterations: 100000,
              bits: 256,
            ).deriveKeyFromPassword(password: code, nonce: salt);
          }

          Uint8List _nonce(List<int> prefix, int counter) {
            final n = Uint8List(12);
            n.setRange(0, 8, prefix);
            n.buffer.asByteData().setUint32(8, counter);
            return n;
          }

          Future<void> _encryptFile(
              String code, String src, String dst, String ext) async {
            final rnd = Random.secure();
            final salt =
                Uint8List.fromList(List.generate(16, (_) => rnd.nextInt(256)));
            final prefix =
                Uint8List.fromList(List.generate(8, (_) => rnd.nextInt(256)));
            final key = await _deriveKey(code, salt);
            final aes = AesGcm.with256bits();
            final extBytes = utf8.encode(ext.length > 20 ? '' : ext);

            final input = await File(src).open();
            final out = File(dst).openWrite();
            try {
              out.add(kMagic);
              out.add(salt);
              out.add(prefix);
              out.add([extBytes.length]);
              final meta = await aes.encrypt(extBytes,
                  secretKey: key, nonce: _nonce(prefix, 0), aad: const [9]);
              out.add(meta.cipherText);
              out.add(meta.mac.bytes);

              final total = await input.length();
              var pos = 0;
              var counter = 1;
              while (true) {
                final n = min(kChunk, total - pos);
                final buf = n > 0 ? await input.read(n) : Uint8List(0);
                pos += n;
                final last = pos >= total;
                final box = await aes.encrypt(buf,
                    secretKey: key,
                    nonce: _nonce(prefix, counter++),
                    aad: [last ? 1 : 0]);
                out.add(box.cipherText);
                out.add(box.mac.bytes);
                if (last) break;
              }
              await out.flush();
            } finally {
              await input.close();
              await out.close();
            }
          }

          Future<String> _decryptFile(String code, String src, String dst) async {
            final input = await File(src).open();
            try {
              final fileLen = await input.length();
              if (fileLen < 29 + 16 + 16) throw Exception('bad file');
              final head = await input.read(29);
              if (!listEquals(head.sublist(0, 4), kMagic)) {
                throw Exception('bad format');
              }
              final salt = head.sublist(4, 20);
              final prefix = head.sublist(20, 28);
              final extLen = head[28];
              final key = await _deriveKey(code, salt);
              final aes = AesGcm.with256bits();

              final metaEnc = await input.read(extLen + 16);
              final extBytes = await aes.decrypt(
                SecretBox(metaEnc.sublist(0, extLen),
                    nonce: _nonce(prefix, 0),
                    mac: Mac(metaEnc.sublist(extLen))),
                secretKey: key,
                aad: const [9],
              );

              var pos = 29 + extLen + 16;
              var counter = 1;
              final out = File(dst).openWrite();
              try {
                while (pos < fileLen) {
                  final n = min(kChunk + 16, fileLen - pos);
                  final enc = await input.read(n);
                  pos += n;
                  final last = pos >= fileLen;
                  final plain = await aes.decrypt(
                    SecretBox(enc.sublist(0, n - 16),
                        nonce: _nonce(prefix, counter++),
                        mac: Mac(enc.sublist(n - 16))),
                    secretKey: key,
                    aad: [last ? 1 : 0],
                  );
                  out.add(plain);
                }
                await out.flush();
              } finally {
                await out.close();
              }
              return utf8.decode(extBytes);
            } finally {
              await input.close();
            }
          }

          Future<String> _hashPin(String pin, Uint8List salt) async {
            final k = await Pbkdf2(
              macAlgorithm: Hmac.sha256(),
              iterations: 50000,
              bits: 256,
            ).deriveKeyFromPassword(password: pin, nonce: salt);
            return base64.encode(await k.extractBytes());
          }

          // Background isolate wrappers (heavy work UI ko freeze nahi karta)
          Future<void> encryptInBg(String code, String src, String dst, String ext) =>
              Isolate.run(() => _encryptFile(code, src, dst, ext));
          Future<String> decryptInBg(String code, String src, String dst) =>
              Isolate.run(() => _decryptFile(code, src, dst));
          Future<String> hashInBg(String pin, List<int> salt) =>
              Isolate.run(() => _hashPin(pin, Uint8List.fromList(salt)));

          // ---------------------------------------------------------------
          // HELPERS
          // ---------------------------------------------------------------
          bool skipLock = false;
          VoidCallback? lockNowHook;
          final navKey = GlobalKey<NavigatorState>();

          String generateCode([int len = 16]) {
            const chars =
                'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            final r = Random.secure();
            return List.generate(len, (_) => chars[r.nextInt(chars.length)]).join();
          }

          String newId() {
            final r = Random.secure();
            return List.generate(16, (_) => r.nextInt(16).toRadixString(16)).join();
          }

          void copySecret(String s) {
            Clipboard.setData(ClipboardData(text: s));
            Future.delayed(const Duration(seconds: 30),
                () => Clipboard.setData(const ClipboardData(text: '')));
          }

          Future<void> shred(File f) async {
            try {
              if (await f.exists()) {
                final len = await f.length();
                final raf = await f.open(mode: FileMode.writeOnly);
                final z = Uint8List(65536);
                var left = len;
                while (left > 0) {
                  final n = min(left, z.length);
                  await raf.writeFrom(z, 0, n);
                  left -= n;
                }
                await raf.flush();
                await raf.close();
              }
            } catch (_) {}
            try {
              await f.delete();
            } catch (_) {}
          }

          Future<void> cleanTemp() async {
            try {
              for (final e in (await getTemporaryDirectory()).listSync()) {
                if (e is File && e.uri.pathSegments.last.startsWith('v_')) {
                  await shred(e);
                }
              }
            } catch (_) {}
          }

          Future<Directory> vaultDir() async {
            final d =
                Directory('${(await getApplicationDocumentsDirectory()).path}/vault');
            if (!await d.exists()) await d.create(recursive: true);
            return d;
          }

          Future<List<Map<String, dynamic>>> loadIndex() async {
            final s = (await SharedPreferences.getInstance()).getString('index');
            if (s == null) return [];
            return (jsonDecode(s) as List).cast<Map<String, dynamic>>();
          }

          Future<void> saveIndex(List<Map<String, dynamic>> l) async {
            await (await SharedPreferences.getInstance())
                .setString('index', jsonEncode(l));
          }

          Future<T> withBusy<T>(BuildContext c, Future<T> Function() job) async {
            showDialog(
              context: c,
              barrierDismissible: false,
              builder: (_) => const PopScope(
                canPop: false,
                child: Center(child: CircularProgressIndicator()),
              ),
            );
            try {
              return await job();
            } finally {
              if (c.mounted && Navigator.of(c, rootNavigator: true).canPop()) {
                Navigator.of(c, rootNavigator: true).pop();
              }
            }
          }

          Future<String?> askCode(BuildContext c,
              {required String title,
              String initial = '',
              bool canGenerate = false}) {
            final ctrl = TextEditingController(text: initial);
            return showDialog<String>(
              context: c,
              builder: (_) => StatefulBuilder(
                builder: (ctx, setS) => AlertDialog(
                  title: Text(title),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(
                        controller: ctrl,
                        autofocus: true,
                        obscureText: !canGenerate,
                        decoration: InputDecoration(
                          border: const OutlineInputBorder(),
                          labelText: 'Code',
                          suffixIcon: IconButton(
                            icon: const Icon(Icons.copy),
                            onP
