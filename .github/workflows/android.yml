name: Build Vault APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create project and write app code
        run: |
          flutter create vault_app --platforms=android --org com.vault
          cd vault_app
          rm -rf test

          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q allowBackup "$MANIFEST" || sed -i 's/<application/<application android:allowBackup="false"/' "$MANIFEST"

          MAIN=$(find android/app/src/main -name 'MainActivity.kt' | head -n1)
          PKG=$(grep -m1 '^package' "$MAIN")
          cat > "$MAIN" <<EOF
          $PKG

          import android.os.Bundle
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  )
              }
          }
          EOF

          cat > pubspec.yaml <<'EOF'
          name: vault_app
          description: Secure vault for images and videos.
          publish_to: 'none'
          version: 2.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            file_picker: ^8.1.6
            cryptography: ^2.7.0
            shared_preferences: ^2.3.2
            path_provider: ^2.1.4
            share_plus: ^10.1.2
            video_player: ^2.9.1

          flutter:
            uses-material-design: true
          EOF

          cat > lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'dart:io';
          import 'dart:isolate';
          import 'dart:math';
          import 'dart:typed_data';

          import 'package:cryptography/cryptography.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/foundation.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:video_player/video_player.dart';

          // ---------------------------------------------------------------
          // CRYPTO (AES-256-GCM, chunked, key = PBKDF2(code))
          // ---------------------------------------------------------------
          const kMagic = <int>[0x56, 0x4C, 0x54, 0x32]; // VLT2
          const kChunk = 1024 * 1024;

          Future<SecretKey> _deriveKey(String code, List<int> salt) {
            return Pbkdf2(
              macAlgorithm: Hmac.sha256(),
              iterations: 100000,
              bits: 256,
            ).deriveKeyFromPassword(password: code, nonce: salt);
          }

          Uint8List _nonce(List<int> prefix, int counter) {
            final n = Uint8List(12);
            n.setRange(0, 8, prefix);
            n.buffer.asByteData().setUint32(8, counter);
            return n;
          }

          Future<void> _encryptFile(
              String code, String src, String dst, String ext) async {
            final rnd = Random.secure();
            final salt =
                Uint8List.fromList(List.generate(16, (_) => rnd.nextInt(256)));
            final prefix =
                Uint8List.fromList(List.generate(8, (_) => rnd.nextInt(256)));
            final key = await _deriveKey(code, salt);
            final aes = AesGcm.with256bits();
            final extBytes = utf8.encode(ext.length > 20 ? '' : ext);

            final input = await File(src).open();
            final out = File(dst).openWrite();
            try {
              out.add(kMagic);
              out.add(salt);
              out.add(prefix);
              out.addByte(extBytes.length);
              final meta = await aes.encrypt(extBytes,
                  secretKey: key, nonce: _nonce(prefix, 0), aad: const [9]);
              out.add(meta.cipherText);
              out.add(meta.mac.bytes);

              final total = await input.length();
              var pos = 0;
              var counter = 1;
              while (true) {
                final n = min(kChunk, total - pos);
                final buf = n > 0 ? await input.read(n) : Uint8List(0);
                pos += n;
                final last = pos >= total;
                final box = await aes.encrypt(buf,
                    secretKey: key,
                    nonce: _nonce(prefix, counter++),
                    aad: [last ? 1 : 0]);
                out.add(box.cipherText);
                out.add(box.mac.bytes);
                if (last) break;
              }
              await out.flush();
            } finally {
              await input.close();
              await out.close();
            }
          }

          Future<String> _decryptFile(String code, String src, String dst) async {
            final input = await File(src).open();
            try {
              final fileLen = await input.length();
              if (fileLen < 29 + 16 + 16) throw Exception('bad file');
              final head = await input.read(29);
              if (!listEquals(head.sublist(0, 4), kMagic)) {
                throw Exception('bad format');
              }
              final salt = head.sublist(4, 20);
              final prefix = head.sublist(20, 28);
              final extLen = head[28];
              final key = await _deriveKey(code, salt);
              final aes = AesGcm.with256bits();

              final metaEnc = await input.read(extLen + 16);
              final extBytes = await aes.decrypt(
                SecretBox(metaEnc.sublist(0, extLen),
                    nonce: _nonce(prefix, 0),
                    mac: Mac(metaEnc.sublist(extLen))),
                secretKey: key,
                aad: const [9],
              );

              var pos = 29 + extLen + 16;
              var counter = 1;
              final out = File(dst).openWrite();
              try {
                while (pos < fileLen) {
                  final n = min(kChunk + 16, fileLen - pos);
                  final enc = await input.read(n);
                  pos += n;
                  final last = pos >= fileLen;
                  final plain = await aes.decrypt(
                    SecretBox(enc.sublist(0, n - 16),
                        nonce: _nonce(prefix, counter++),
                        mac: Mac(enc.sublist(n - 16))),
                    secretKey: key,
                    aad: [last ? 1 : 0],
                  );
                  out.add(plain);
                }
                await out.flush();
              } finally {
                await out.close();
              }
              return utf8.decode(extBytes);
            } finally {
              await input.close();
            }
          }

          Future<String> _hashPin(String pin, Uint8List salt) async {
            final k = await Pbkdf2(
              macAlgorithm: Hmac.sha256(),
              iterations: 50000,
              bits: 256,
            ).deriveKeyFromPassword(password: pin, nonce: salt);
            return base64.encode(await k.extractBytes());
          }

          // Background isolate wrappers (heavy work UI ko freeze nahi karta)
          Future<void> encryptInBg(String code, String src, String dst, String ext) =>
              Isolate.run(() => _encryptFile(code, src, dst, ext));
          Future<String> decryptInBg(String code, String src, String dst) =>
              Isolate.run(() => _decryptFile(code, src, dst));
          Future<String> hashInBg(String pin, List<int> salt) =>
              Isolate.run(() => _hashPin(pin, Uint8List.fromList(salt)));

          // ---------------------------------------------------------------
          // HELPERS
          // ---------------------------------------------------------------
          bool skipLock = false;
          VoidCallback? lockNowHook;
          final navKey = GlobalKey<NavigatorState>();

          String generateCode([int len = 16]) {
            const chars =
                'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            final r = Random.secure();
            return List.generate(len, (_) => chars[r.nextInt(chars.length)]).join();
          }

          String newId() {
            final r = Random.secure();
            return List.generate(16, (_) => r.nextInt(16).toRadixString(16)).join();
          }

          void copySecret(String s) {
            Clipboard.setData(ClipboardData(text: s));
            Future.delayed(const Duration(seconds: 30),
                () => Clipboard.setData(const ClipboardData(text: '')));
          }

          Future<void> shred(File f) async {
            try {
              if (await f.exists()) {
                final len = await f.length();
                final raf = await f.open(mode: FileMode.writeOnly);
                final z = Uint8List(65536);
                var left = len;
                while (left > 0) {
                  final n = min(left, z.length);
                  await raf.writeFrom(z, 0, n);
                  left -= n;
                }
                await raf.flush();
                await raf.close();
              }
            } catch (_) {}
            try {
              await f.delete();
            } catch (_) {}
          }

          Future<void> cleanTemp() async {
            try {
              for (final e in (await getTemporaryDirectory()).listSync()) {
                if (e is File && e.uri.pathSegments.last.startsWith('v_')) {
                  await shred(e);
                }
              }
            } catch (_) {}
          }

          Future<Directory> vaultDir() async {
            final d =
                Directory('${(await getApplicationDocumentsDirectory()).path}/vault');
            if (!await d.exists()) await d.create(recursive: true);
            return d;
          }

          Future<List<Map<String, dynamic>>> loadIndex() async {
            final s = (await SharedPreferences.getInstance()).getString('index');
            if (s == null) return [];
            return (jsonDecode(s) as List).cast<Map<String, dynamic>>();
          }

          Future<void> saveIndex(List<Map<String, dynamic>> l) async {
            await (await SharedPreferences.getInstance())
                .setString('index', jsonEncode(l));
          }

          Future<T> withBusy<T>(BuildContext c, Future<T> Function() job) async {
            showDialog(
              context: c,
              barrierDismissible: false,
              builder: (_) => const PopScope(
                canPop: false,
                child: Center(child: CircularProgressIndicator()),
              ),
            );
            try {
              return await job();
            } finally {
              if (c.mounted && Navigator.of(c, rootNavigator: true).canPop()) {
                Navigator.of(c, rootNavigator: true).pop();
              }
            }
          }

          Future<String?> askCode(BuildContext c,
              {required String title,
              String initial = '',
              bool canGenerate = false}) {
            final ctrl = TextEditingController(text: initial);
            return showDialog<String>(
              context: c,
              builder: (_) => StatefulBuilder(
                builder: (ctx, setS) => AlertDialog(
                  title: Text(title),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(
                        controller: ctrl,
                        autofocus: true,
                        obscureText: !canGenerate,
                        decoration: InputDecoration(
                          border: const OutlineInputBorder(),
                          labelText: 'Code',
                          suffixIcon: IconButton(
                            icon: const Icon(Icons.copy),
                            onPressed: () => copySecret(ctrl.text),
                          ),
                        ),
                      ),
                      if (canGenerate)
                        TextButton.icon(
                          onPressed: () => setS(() => ctrl.text = generateCode()),
                          icon: const Icon(Icons.autorenew),
                          label: const Text('Naya code'),
                        ),
                    ],
                  ),
                  actions: [
                    TextButton(
                        onPressed: () => Navigator.pop(ctx),
                        child: const Text('Cancel')),
                    FilledButton(
                        onPressed: () => Navigator.pop(ctx, ctrl.text.trim()),
                        child: const Text('OK')),
                  ],
                ),
              ),
            );
          }

          // ---------------------------------------------------------------
          // PIN
          // ---------------------------------------------------------------
          class Pin {
            static Future<bool> isSet() async =>
                (await SharedPreferences.getInstance()).containsKey('pin_hash');

            static Future<void> set(String pin) async {
              final p = await SharedPreferences.getInstance();
              final r = Random.secure();
              final salt = List<int>.generate(16, (_) => r.nextInt(256));
              await p.setString('pin_salt', base64.encode(salt));
              await p.setString('pin_hash', await hashInBg(pin, salt));
              await p.setInt('fails', 0);
            }

            static Future<int> waitSeconds() async {
              final p = await SharedPreferences.getInstance();
              final left =
                  (p.getInt('until') ?? 0) - DateTime.now().millisecondsSinceEpoch;
              return left > 0 ? (left / 1000).ceil() : 0;
            }

            static Future<bool> verify(String pin) async {
              final p = await SharedPreferences.getInstance();
              final salt = base64.decode(p.getString('pin_salt')!);
              final h = await hashInBg(pin, salt);
              if (h == p.getString('pin_hash')) {
                await p.setInt('fails', 0);
                return true;
              }
              final f = (p.getInt('fails') ?? 0) + 1;
              await p.setInt('fails', f);
              if (f >= 5) {
                await p.setInt('until',
                    DateTime.now().millisecondsSinceEpoch + 30000 * (f - 4));
              }
              return false;
            }
          }

          // ---------------------------------------------------------------
          // APP
          // ---------------------------------------------------------------
          void main() => runApp(const VaultApp());

          class VaultApp extends StatelessWidget {
            const VaultApp({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
                  navigatorKey: navKey,
                  title: 'Vault',
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                      colorSchemeSeed: Colors.teal,
                      useMaterial3: true,
                      brightness: Brightness.dark),
                  home: const Gate(),
                );
          }

          class Gate extends StatefulWidget {
            const Gate({super.key});
            @override
            State<Gate> createState() => _GateState();
          }

          class _GateState extends State<Gate> with WidgetsBindingObserver {
            bool? _hasPin;
            bool _locked = true;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              lockNowHook = _lock;
              cleanTemp();
              Pin.isSet().then((v) {
                if (mounted) setState(() => _hasPin = v);
              });
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              super.dispose();
            }

            void _lock() {
              navKey.currentState?.popUntil((r) => r.isFirst);
              if (mounted) setState(() => _locked = true);
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState s) {
              if (s == AppLifecycleState.paused && !skipLock) _lock();
              if (s == AppLifecycleState.resumed) skipLock = false;
            }

            @override
            Widget build(BuildContext context) {
              if (_hasPin == null) {
                return const Scaffold(
                    body: Center(child: CircularProgressIndicator()));
              }
              if (_locked) {
                return LockScreen(
                  setup: !_hasPin!,
                  onUnlocked: () => setState(() {
                    _hasPin = true;
                    _locked = false;
                  }),
                );
              }
              return const VaultHome();
            }
          }

          class LockScreen extends StatefulWidget {
            final bool setup;
            final VoidCallback onUnlocked;
            const LockScreen({super.key, required this.setup, required this.onUnlocked});
            @override
            State<LockScreen> createState() => _LockScreenState();
          }

          class _LockScreenState extends State<LockScreen> {
            final _a = TextEditingController();
            final _b = TextEditingController();
            String _err = '';
            bool _busy = false;

            Future<void> _go() async {
              setState(() {
                _busy = true;
                _err = '';
              });
              try {
                if (widget.setup) {
                  if (_a.text.length < 4) {
                    _err = 'Kam az kam 4 digit ka PIN rakhein';
                  } else if (_a.text != _b.text) {
                    _err = 'Dono PIN match nahi karte';
                  } else {
                    await Pin.set(_a.text);
                    widget.onUnlocked();
                    return;
                  }
                } else {
                  final w = await Pin.waitSeconds();
                  if (w > 0) {
                    _err = '$w second baad dobara try karein';
                  } else if (await Pin.verify(_a.text)) {
                    widget.onUnlocked();
                    return;
                  } else {
                    _err = 'Galat PIN';
                  }
                  _a.clear();
                }
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }

            Widget _field(TextEditingController c, String label) => Padding(
                  padding: const EdgeInsets.only(bottom: 12),
                  child: TextField(
                    controller: c,
                    obscureText: true,
                    keyboardType: TextInputType.number,
                    maxLength: 12,
                    inputFormatters: [FilteringTextInputFormatter.digitsOnly],
                    decoration: InputDecoration(
                        border: const OutlineInputBorder(), labelText: label),
                  ),
                );

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(28),
                      child: Column(
                        children: [
                          const Icon(Icons.shield, size: 72),
                          const SizedBox(height: 12),
                          Text(
                            widget.setup ? 'Naya PIN set karein' : 'PIN enter karein',
                            style: Theme.of(context).textTheme.titleLarge,
                          ),
                          const SizedBox(height: 20),
                          _field(_a, 'PIN'),
                          if (widget.setup) _field(_b, 'PIN dobara'),
                          if (_err.isNotEmpty)
                            Text(_err,
                                style: const TextStyle(color: Colors.redAccent)),
                          const SizedBox(height: 16),
                          FilledButton(
                            onPressed: _busy ? null : _go,
                            child: Text(widget.setup ? 'PIN save karein' : 'Unlock'),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // ---------------------------------------------------------------
          // VAULT HOME
          // ---------------------------------------------------------------
          class VaultHome extends StatefulWidget {
            const VaultHome({super.key});
            @override
            State<VaultHome> createState() => _VaultHomeState();
          }

          class _VaultHomeState extends State<VaultHome> {
            List<Map<String, dynamic>> _items = [];

            @override
            void initState() {
              super.initState();
              _reload();
            }

            Future<void> _reload() async {
              final l = await loadIndex();
              if (mounted) setState(() => _items = l.reversed.toList());
            }

            void _snack(String s) {
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(s)));
              }
            }

            Future<void> _add() async {
              skipLock = true;
              final r = await FilePicker.platform.pickFiles(type: FileType.media);
              if (r == null || r.files.single.path == null) return;
              final f = r.files.single;
              if (!mounted) return;
              final code = await askCode(context,
                  title: 'Encryption code',
                  initial: generateCode(16),
                  canGenerate: true);
              if (code == null) return;
              if (code.length < 8) {
                _snack('Code kam az kam 8 characters ka hona chahiye');
                return;
              }
              if (!mounted) return;
              final id = newId();
              final dst = '${(await vaultDir()).path}/$id.vlt';
              try {
                await withBusy(context,
                    () => encryptInBg(code, f.path!, dst, (f.extension ?? '').toLowerCase()));
              } catch (e) {
                await shred(File(dst));
                _snack('Encrypt nahi ho saki: $e');
                return;
              }
              if (f.path!.contains('/cache/')) {
                try {
                  await File(f.path!).delete();
                } catch (_) {}
              }
              final idx = await loadIndex();
              idx.add({
                'id': id,
                'name': f.name,
                'size': await File(dst).length(),
                'ts': DateTime.now().millisecondsSinceEpoch,
              });
              await saveIndex(idx);
              _snack('Encrypt ho gayi. Code surakshit rakhein, wapas nahi milega!');
              _reload();
            }

            Future<void> _import() async {
              skipLock = true;
              final r = await FilePicker.platform.pickFiles(type: FileType.any);
              if (r == null || r.files.single.path == null) return;
              final src = r.files.single.path!;
              final raf = await File(src).open();
              final h = await raf.read(4);
              await raf.close();
              if (!listEquals(h, kMagic)) {
                _snack('Yeh Vault ki .vlt file nahi hai');
                return;
              }
              final id = newId();
              final dst = '${(await vaultDir()).path}/$id.vlt';
              await File(src).copy(dst);
              if (src.contains('/cache/')) {
                try {
                  await File(src).delete();
                } catch (_) {}
              }
              final idx = await loadIndex();
              idx.add({
                'id': id,
                'name': 'Received file',
                'size': await File(dst).length(),
                'ts': DateTime.now().millisecondsSinceEpoch,
              });
              await saveIndex(idx);
              _snack('File import ho gayi. Ab code se khol sakte hain.');
              _reload();
            }

            Future<String?> _decryptToTemp(Map<String, dynamic> it) async {
              final code = await askCode(context, title: 'Code enter karein');
              if (code == null || code.isEmpty || !mounted) return null;
              final src = '${(await vaultDir()).path}/${it['id']}.vlt';
              final tmp = '${(await getTemporaryDirectory()).path}/v_${it['id']}';
              try {
                final ext = await withBusy(context, () => decryptInBg(code, src, tmp));
                final out = ext.isEmpty ? tmp : '$tmp.$ext';
                if (out != tmp) await File(tmp).rename(out);
                return out;
              } catch (_) {
                await shred(File(tmp));
                _snack('Code galat hai ya file kharab hai');
                return null;
              }
            }

            Future<void> _open(Map<String, dynamic> it) async {
              final p = await _decryptToTemp(it);
              if (p == null || !mounted) return;
              await Navigator.push(
                  context, MaterialPageRoute(builder: (_) => Viewer(path: p)));
            }

            Future<void> _share(Map<String, dynamic> it) async {
              skipLock = true;
              final path = '${(await vaultDir()).path}/${it['id']}.vlt';
              await Share.shareXFiles(
                [XFile(path, mimeType: 'application/octet-stream')],
                text: 'Encrypted Vault file. Code alag se bhej raha hun.',
              );
            }

            Future<void> _save(Map<String, dynamic> it) async {
              final p = await _decryptToTemp(it);
              if (p == null) return;
              skipLock = true;
              try {
                final dot = p.lastIndexOf('.');
                final slash = p.lastIndexOf('/');
                final ext = dot > slash ? p.substring(dot) : '';
                final base = it['name'] as String;
                final name = base.contains('.') ? base : 'decrypted_${it['id']}$ext';
                await FilePicker.platform.saveFile(
                  dialogTitle: 'Decrypted file save karein',
                  fileName: name,
                  bytes: await File(p).readAsBytes(),
                );
                _snack('Save ho gayi');
              } catch (e) {
                _snack('Save nahi ho saki: $e');
              } finally {
                await shred(File(p));
              }
            }

            Future<void> _delete(Map<String, dynamic> it) async {
              final ok = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Delete karein?'),
                  content: const Text('File hamesha ke liye mit jayegi.'),
                  actions: [
                    TextButton(
                        onPressed: () => Navigator.pop(ctx, false),
                        child: const Text('Nahi')),
                    FilledButton(
                        onPressed: () => Navigator.pop(ctx, true),
                        child: const Text('Delete')),
                  ],
                ),
              );
              if (ok != true) return;
              await shred(File('${(await vaultDir()).path}/${it['id']}.vlt'));
              final idx = await loadIndex();
              idx.removeWhere((e) => e['id'] == it['id']);
              await saveIndex(idx);
              _reload();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Vault'),
                  actions: [
                    IconButton(
                        tooltip: 'Import .vlt',
                        icon: const Icon(Icons.download),
                        onPressed: _import),
                    IconButton(
                        tooltip: 'Lock',
                        icon: const Icon(Icons.lock),
                        onPressed: () => lockNowHook?.call()),
                  ],
                ),
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: _add,
                  icon: const Icon(Icons.add),
                  label: const Text('Encrypt karein'),
                ),
                body: _items.isEmpty
                    ? const Center(
                        child: Padding(
                          padding: EdgeInsets.all(24),
                          child: Text(
                            'Vault khali hai.\nImage ya video encrypt karne ke liye neeche button dabayein.',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      )
                    : ListView.builder(
                        itemCount: _items.length,
                        itemBuilder: (_, i) {
                          final it = _items[i];
                          final mb = ((it['size'] as num) / 1048576).toStringAsFixed(2);
                          final date = DateTime.fromMillisecondsSinceEpoch(it['ts'] as int)
                              .toString()
                              .substring(0, 16);
                          return ListTile(
                            leading: const Icon(Icons.lock_outline),
                            title: Text(it['name'] as String,
                                maxLines: 1, overflow: TextOverflow.ellipsis),
                            subtitle: Text('$mb MB  •  $date'),
                            onTap: () => _open(it),
                            trailing: PopupMenuButton<String>(
                              onSelected: (v) {
                                if (v == 'share') _share(it);
                                if (v == 'save') _save(it);
                                if (v == 'del') _delete(it);
                              },
                              itemBuilder: (_) => const [
                                PopupMenuItem(
                                    value: 'share', child: Text('Share (encrypted)')),
                                PopupMenuItem(
                                    value: 'save', child: Text('Decrypt aur save')),
                                PopupMenuItem(value: 'del', child: Text('Delete')),
                              ],
                            ),
                          );
                        },
                      ),
              );
            }
          }

          // ---------------------------------------------------------------
          // VIEWER (decrypted file sirf temp me, band hote hi mit jati hai)
          // ---------------------------------------------------------------
          class Viewer extends StatefulWidget {
            final String path;
            const Viewer({super.key, required this.path});
            @override
            State<Viewer> createState() => _ViewerState();
          }

          class _ViewerState extends State<Viewer> {
            VideoPlayerController? _vc;
            bool _video = false;

            @override
            void initState() {
              super.initState();
              final e = widget.path.split('.').last.toLowerCase();
              _video = const {'mp4', 'mov', 'mkv', '3gp', 'webm', 'avi', 'm4v'}
                  .contains(e);
              if (_video) {
                final c = VideoPlayerController.file(File(widget.path));
                _vc = c;
                c.addListener(() {
                  if (mounted) setState(() {});
                });
                c.initialize().then((_) => c.play());
              }
            }

            @override
            void dispose() {
              _vc?.dispose();
              shred(File(widget.path));
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              Widget body;
              if (_video) {
                final c = _vc!;
                body = c.value.isInitialized
                    ? Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          AspectRatio(
                              aspectRatio: c.value.aspectRatio, child: VideoPlayer(c)),
                          VideoProgressIndicator(c, allowScrubbing: true),
                          IconButton(
                            icon: Icon(
                                c.value.isPlaying ? Icons.pause : Icons.play_arrow),
                            onPressed: () => c.value.isPlaying ? c.pause() : c.play(),
                          ),
                        ],
                      )
                    : const CircularProgressIndicator();
              } else {
                body = InteractiveViewer(
                  child: Image.file(
                    File(widget.path),
                    errorBuilder: (_, __, ___) => const Text('Preview nahi ho saka'),
                  ),
                );
              }
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(title: Text(_video ? 'Video' : 'Image')),
                body: Center(child: body),
              );
            }
          }
          EOF

      - name: Build APK
        working-directory: vault_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vault-apk
          path: vault_app/build/app/outputs/flutter-apk/app-release.apk
